[package]
name = "loopw"
version = "0.1.0"
edition = "2021"
description = "LoopW — radial window manager for Windows (Rust + iced port)"
license = "MIT"

[[bin]]
name = "loopw"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
tray-icon = "0.20"

[profile.release]
opt-level = 2
strip = true
lto = false
panic = "unwind"

[profile.release-self-contained]
inherits = "release"
